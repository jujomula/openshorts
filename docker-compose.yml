
services:
  backend:
    build:
      context: .
      args:
        GPU: "0"
    container_name: openshorts-backend
    ports:
      - "192.168.18.135:8000:8000"
    environment:
      MAX_CONCURRENT_JOBS: "1"
    volumes:
      - .:/app
      - /app/__pycache__
      - openshorts_output:/app/output
    restart: unless-stopped
    cpus: 4.0
    mem_limit: 6g
    init: true

  frontend:
    build:
      context: ./dashboard
      target: dev
    container_name: openshorts-frontend
    ports:
      - "192.168.18.135:5175:5173"
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    restart: unless-stopped
    depends_on:
      - backend
    cpus: 0.5
    mem_limit: 768m
    init: true

  renderer:
    build:
      context: .
      dockerfile: render-service/Dockerfile
    container_name: openshorts-renderer
    ports:
      - "192.168.18.135:3100:3100"
    volumes:
      - openshorts_output:/output
    environment:
      REMOTION_BUNDLE_PATH: /app/remotion
      OUTPUT_DIR: /output
      PORT: "3100"
    restart: unless-stopped
    depends_on:
      - backend
    cpus: 1.5
    mem_limit: 2g
    init: true

volumes:
  openshorts_output:
    name: openshorts_output

